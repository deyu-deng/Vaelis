# Vaelis L1 (secretary) profile template
# Copy/activate via: hermes profile create master  (then merge these knobs)
# Intent: best available model, narrow tool surface, clean orchestrator context.
# Contract: docs/vaelis/north_star/GRILL_FREEZE.md; routing rationale: ADR-0011.

# L1 = best available model (currently Kimi K3). Cost discipline matters more
# than model choice: K3 bills reasoning as output (~CNY 100/M) and always
# thinks, so L1 must stay OUT of tool loops and per-message classification.
model: ""  # e.g. moonshot/kimi-k3 — set when key is available

# L2 (project / specialist agents) run cheap models or aigw-aggregated quota.
# Keep L1 and L2 on SEPARATE sessions — never switch models mid reasoning chain.
delegation:
  orchestrator_enabled: true
  max_spawn_depth: 2
  max_concurrent_children: 4
  # Point delegation at the cheap L2 model; L1 only receives summaries.
  provider: ""   # e.g. deepseek
  model: ""      # e.g. deepseek-chat

# L1 must NOT burn free-tier GUI quotas itself. GUI-only closed-source apps
# are L3 executors driven over Pico HID (priority queue, ADR-0011).

# Memory brain: Mind holds knowledge + profile (set MIND_ROOT; the vault lives
# outside this repo). Runtime state (agenda / DDL) lives in SQLite, not Mind
# (ADR-0007). Mind writes go through the non-LLM serial writer service.
memory:
  memory_enabled: true
  # provider: mind   # enable once plugins/memory/mind has real disk I/O

# Narrow toolsets for L1 sessions — expand only via skills when needed.
platform_toolsets:
  cli:
    - delegation
    - todo
    - clarify
    - vaelis_north_star
  gateway:
    - delegation
    - todo
    - clarify
    - vaelis_north_star

plugins:
  # Standalone plugins are opt-in — this profile must enable North Star.
  enabled:
    - vaelis-north-star
  entries:
    vaelis-north-star:
      enabled: true

# Approvals: human closes high-risk; night mode respects the risk queue.
approvals:
  mode: manual

display:
  # L1 UI should emphasize status / approvals / preview, not raw tool spam.
  tool_progress: verbose
